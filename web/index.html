<title>Tnote</title>
<style>
/* Layout: Windows 11 Notepad — tab strip (title bar), menu + formatting row, editor, status bar.
   Light colors are sampled from a screenshot of the real app. */
:root {
  --title: #d1dbec; --chrome: #f1f4f9; --surface: #f9f9f9; --bg: #f1f4f9;
  --fg: #1a1a1a; --muted: #5f5f5f; --line: #e4e7ec; --accent: #005fb8;
  --hover: #e3e7ee; --pressed: #d8dde6; --menu: #f9f9f9; --menu-line: #e0e0e0; --danger: #c42b1c;
  --ui: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: Consolas, "Cascadia Mono", "D2Coding", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --title: #202020; --chrome: #2c2c2c; --surface: #272727; --bg: #2c2c2c;
  --fg: #ffffff; --muted: #c5c5c5; --line: #1d1d1d; --accent: #60cdff;
  --hover: #383838; --pressed: #333333; --menu: #2c2c2c; --menu-line: #3a3a3a; --danger: #ff99a4; color-scheme: dark } }
:root[data-theme="dark"] {
  --title: #202020; --chrome: #2c2c2c; --surface: #272727; --bg: #2c2c2c;
  --fg: #ffffff; --muted: #c5c5c5; --line: #1d1d1d; --accent: #60cdff;
  --hover: #383838; --pressed: #333333; --menu: #2c2c2c; --menu-line: #3a3a3a; --danger: #ff99a4; color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--title); color: var(--fg); font-family: var(--ui); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
svg.chev { width: 10px; height: 10px; }

.tabs { display: flex; align-items: flex-end; height: 42px; padding: 0 8px 0 0; background: var(--title); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.appicon { width: 48px; height: 42px; display: grid; place-items: center; flex-shrink: 0; color: var(--accent); }
.appicon svg { width: 18px; height: 18px; }
.tab { position: relative; display: flex; align-items: center; height: 36px; width: 240px; min-width: 80px; flex-shrink: 1;
  padding: 0 4px 0 12px; border-radius: 8px 8px 0 0; color: var(--fg); }
.tab:hover { background: var(--hover); }
.tab.active { background: var(--chrome); }
.tab + .tab:not(.active):not(:hover)::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 1px; background: color-mix(in srgb, var(--muted) 25%, transparent); }
.tab.active + .tab::before, .tab:hover + .tab::before { display: none; }
.tab .name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; height: 100%; }
.tab .x { width: 28px; height: 24px; border-radius: 4px; display: grid; place-items: center; flex-shrink: 0; }
.tab .x svg { width: 10px; height: 10px; }
.tab .x:hover { background: var(--pressed); }
.tab .x .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg); }
.addtab { width: 34px; height: 30px; margin: 0 0 3px 6px; border-radius: 4px; display: grid; place-items: center; flex-shrink: 0; }
.addtab svg { width: 14px; height: 14px; }
.addtab:hover { background: var(--hover); }
.tabs .drag { flex: 1; min-width: 8px; align-self: stretch; }
.caps { display: flex; align-self: flex-start; flex-shrink: 0; margin-right: -8px; }
.caps button { width: 46px; height: 32px; display: grid; place-items: center; }
.caps svg { width: 10px; height: 10px; stroke-width: 1; }
.caps button:hover { background: var(--hover); }
.caps button.close:hover { background: #c42b1c; color: #fff; }
.app.collapsed > :not(.tabs) { display: none !important; }
.app.collapsed { height: auto; }

.menubar { display: flex; align-items: center; gap: 2px; height: 33px; padding: 0 8px; background: var(--chrome); border-bottom: 1px solid var(--line); position: relative; flex-shrink: 0; }
.menubar > div { position: relative; }
.menubtn { height: 27px; padding: 0 12px; border-radius: 4px; white-space: nowrap; }
@media (max-width: 720px) { .menubar .gap, .fmt:not(.right) { display: none; } .menubtn { padding: 0 8px; } }
.menubtn:hover, .menubtn[aria-expanded="true"] { background: var(--hover); }
.menu { position: absolute; top: 100%; left: 0; z-index: 10; min-width: 260px; padding: 4px; margin-top: 3px;
  background: var(--menu); border: 1px solid var(--menu-line); border-radius: 8px; box-shadow: 0 8px 16px rgb(0 0 0 / .14); }
.menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; padding: 7px 12px; border-radius: 4px; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu kbd { font-family: var(--ui); color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu .check::before { content: "✓ "; color: var(--accent); }
.menu .nocheck::before { content: "\2003 "; }
.menu .empty { padding: 6px 10px; color: var(--muted); }

.menubar .spacer { flex: 1; }
.menubar .gap { width: calc(34% - 190px); flex-shrink: 1; min-width: 8px; }
.fmt { display: flex; gap: 2px; align-items: center; }
.fmt > div { position: relative; }
.fbtn { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.fbtn:hover, .fbtn[aria-pressed="true"], .fbtn[aria-expanded="true"] { background: var(--hover); }
.fbtn b { font-weight: 700; font-size: 15px; }
.fmt .menu { min-width: 180px; }
.fmt.right .menu { left: auto; right: 0; }
.preview { flex: 1; min-height: 0; overflow: auto; background: var(--surface); padding: 10px 20px; line-height: 1.6; }
.preview > * { max-width: 72ch; }
.preview h1, .preview h2, .preview h3 { line-height: 1.25; text-wrap: balance; }
.preview code { font-family: var(--mono); background: var(--hover); padding: 1px 4px; border-radius: 3px; }
.preview pre { background: var(--hover); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.preview pre code { background: none; padding: 0; }
.preview blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.preview table { border-collapse: collapse; }
.preview th, .preview td { border: 1px solid var(--line); padding: 4px 10px; }
.preview a { color: var(--accent); }
.preview hr { border: 0; border-top: 1px solid var(--line); }
.findbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.findbar input[type=text] { flex: 1 1 160px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
.findbar button { padding: 5px 10px; border-radius: 5px; border: 1px solid var(--line); }
.findbar button:hover { background: var(--hover); }
.findbar label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
.findbar .msg { color: var(--danger); font-size: 12px; }

.editor { flex: 1; min-height: 0; background: var(--surface); }
textarea { width: 100%; height: 100%; resize: none; border: 0; padding: 10px 14px; background: var(--surface); color: var(--fg);
  font-family: var(--mono); font-size: 14.67px; line-height: 1.4; tab-size: 4; outline: none; scrollbar-width: thin; }
textarea:focus-visible { outline: none; }
textarea.nowrap { white-space: pre; overflow-wrap: normal; overflow-x: auto; }
/* Live formatting: a styled copy of the text sits under a transparent textarea. Only style and
   color change (never glyph width), so the caret stays aligned with the glyphs. */
.editor { position: relative; }
.hl { position: absolute; inset: 0; margin: 0; overflow: hidden; pointer-events: none; padding: 10px 14px; color: var(--fg);
  font-family: var(--mono); font-size: 14.67px; line-height: 1.4; tab-size: 4; white-space: pre-wrap; overflow-wrap: break-word; }
.hl.nowrap { white-space: pre; overflow-wrap: normal; }
.hl > div { will-change: transform; }
.editor.live textarea { position: relative; background: transparent; color: transparent; caret-color: var(--fg); }
.editor.live textarea::selection { color: transparent; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.hl .b { text-shadow: .6px 0 currentColor, -.2px 0 currentColor; } /* faux bold: real bold Hangul is wider and would shift the caret */ .hl .i { font-style: italic; } .hl .s { text-decoration: line-through; }
.hl .u { text-decoration: underline; } .hl .s.u { text-decoration: underline line-through; }
.hl .c { background: var(--hover); border-radius: 2px; }
.hl .d { color: color-mix(in srgb, var(--fg) 45%, var(--surface)); } .hl .a { color: var(--accent); } .hl .q { color: var(--muted); }

/* Column starts measured at 1000px: 24, 104, ~304 (centre), then right-anchored 388/320/152 from the edge */
.status { display: grid; grid-template-columns: 80px minmax(0, 200px) 1fr 68px 168px 152px; align-items: center; height: 32px; padding-left: 14px;
  background: var(--chrome); border-top: 1px solid var(--line); color: var(--fg); font-size: 12px;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; flex-shrink: 0; }
.status span { padding: 0 10px; border-left: 1px solid var(--line); line-height: 14px; overflow: hidden; text-overflow: ellipsis; }
.status span:first-child { border-left: 0; }
@media (max-width: 640px) { .status { grid-template-columns: auto 1fr auto auto; } #stKind, #stEol { display: none; } }

.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(380px, 100%); display: grid; gap: 14px; box-shadow: 0 16px 40px rgb(0 0 0 / .25); }
.dialog h2 { font-size: 16px; margin: 0; font-weight: 600; }
.dialog p { margin: 0; color: var(--muted); }
.dialog input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog .row button { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--line); }
.dialog .row button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 8px 14px; border-radius: 6px; z-index: 30; max-width: calc(100% - 32px); }
</style>

<div class="app">
  <div class="tabs" id="tabs" role="tablist"></div>
  <nav class="menubar" id="menubar"></nav>
  <div class="findbar" id="findbar" hidden>
    <input type="text" id="findInput" placeholder="찾기" aria-label="찾을 내용">
    <input type="text" id="replaceInput" placeholder="바꾸기" aria-label="바꿀 내용">
    <button id="findPrev" title="Shift+F3">이전</button>
    <button id="findNext" title="F3">다음</button>
    <button id="replaceOne">바꾸기</button>
    <button id="replaceAll">모두 바꾸기</button>
    <label><input type="checkbox" id="matchCase"> 대/소문자 구분</label>
    <span class="msg" id="findMsg"></span>
    <button id="findClose" aria-label="찾기 닫기">✕</button>
  </div>
  <div class="editor" id="editorWrap"><pre class="hl" id="hl" aria-hidden="true"><div></div></pre><textarea id="ed" spellcheck="false" aria-label="문서 내용"></textarea></div>
  <div class="preview" id="preview" hidden></div>
  <div class="status" id="status">
    <span id="stPos"></span><span id="stChars"></span><span id="stKind">일반 텍스트</span><span id="stZoom"></span><span id="stEol"></span><span id="stEnc"></span>
  </div>
</div>
<input type="file" id="fileInput" multiple hidden>
<div id="modalRoot"></div>

<script>
// Same feature set as the WinForms version (tnote.cs), modeled on Windows 11 Notepad's
// TabsBar / MainMenuBar / FindReplaceDialog / GotoDialogContent / StatusBar.
const $ = id => document.getElementById(id);
const ed = $('ed');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const SAMPLE = 'Tnote에 오신 것을 환영합니다.\n\n' +
  '- 파일 > 열기(Ctrl+O)로 텍스트 파일을 열 수 있습니다.\n' +
  '- 탭: Alt+N 새 탭, Alt+W 탭 닫기 (Ctrl+N/W는 브라우저가 사용합니다)\n' +
  '- Ctrl+F 찾기, Ctrl+H 바꾸기, Ctrl+G 줄 이동, F5 시간/날짜\n' +
  '- Ctrl+휠 또는 Ctrl+=/- 로 확대/축소\n\n' +
  '열린 탭은 이 브라우저에 자동 보관됩니다.';

let state = store.get('np.state', null) || {
  tabs: [{ id: 1, name: null, text: SAMPLE, dirty: false, enc: 'UTF-8', eol: '\r\n' }], active: 1, nextId: 2
};
let settings = Object.assign({ wrap: true, statusBar: true, zoom: 1, theme: 'system', live: true }, store.get('np.settings', {}));
let blockMode = false; // block selection toggle: lines are shown unwrapped while it is on
const shownWrap = () => settings.wrap && !blockMode;
let recent = store.get('np.recent', []);
const handles = {}; // File System Access handles (not persisted)
const undoStacks = {}; // per-tab edit history is native; we keep scroll/selection only

const cur = () => state.tabs.find(t => t.id === state.active);
const title = t => t.name || '제목 없음';
const persist = () => { store.set('np.state', state); store.set('np.settings', settings); store.set('np.recent', recent); };
let persistTimer; const persistSoon = () => { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 400); };

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.append(el); setTimeout(() => el.remove(), 2200);
}

// In-page dialogs (alert/confirm/prompt are unavailable in the artifact viewer)
function dialog({ title: h, body, input, buttons }) {
  return new Promise(resolve => {
    const root = $('modalRoot');
    root.innerHTML = '';
    const m = document.createElement('div'); m.className = 'modal';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog');
    const hh = document.createElement('h2'); hh.textContent = h; d.append(hh);
    if (body) { const p = document.createElement('p'); p.textContent = body; d.append(p); }
    let inp;
    if (input) { inp = document.createElement('input'); Object.assign(inp, input); inp.id = 'dlgInput'; d.append(inp); }
    const row = document.createElement('div'); row.className = 'row';
    const close = v => { root.innerHTML = ''; ed.focus(); resolve(v); };
    buttons.forEach(b => {
      const bt = document.createElement('button'); bt.textContent = b.label;
      if (b.primary) bt.className = 'primary';
      bt.onclick = () => close(inp && b.value !== null ? { button: b.value, value: inp.value } : b.value);
      row.append(bt);
    });
    d.append(row); m.append(d); root.append(m);
    m.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter') { const p = buttons.find(b => b.primary); if (p) close(inp ? { button: p.value, value: inp.value } : p.value); }
    });
    (inp || row.querySelector('.primary') || row.firstChild).focus();
  });
}

// ---------- tabs ----------
function renderTabs() {
  const box = $('tabs'); box.innerHTML = '';
  const appIcon = document.createElement('div'); appIcon.className = 'appicon'; appIcon.innerHTML = ICON.page; box.append(appIcon);
  state.tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === state.active ? ' active' : '');
    el.setAttribute('role', 'tab'); el.title = title(t);
    const name = document.createElement('button'); name.className = 'name';
    name.textContent = title(t); name.onclick = () => switchTab(t.id);
    const x = document.createElement('button'); x.className = 'x';
    const show = hover => x.innerHTML = t.dirty && !hover ? '<span class="dot"></span>' : ICON.close;
    show(false);
    x.setAttribute('aria-label', title(t) + ' 닫기');
    el.onmouseenter = () => show(true); el.onmouseleave = () => show(false);
    x.onclick = e => { e.stopPropagation(); closeTab(t.id); };
    el.onauxclick = e => { if (e.button === 1) closeTab(t.id); };
    el.append(name, x); box.append(el);
  });
  const add = document.createElement('button'); add.className = 'addtab'; add.innerHTML = ICON.plus;
  add.title = '새 탭 (Alt+N)'; add.setAttribute('aria-label', '새 탭'); add.onclick = () => newTab(); box.append(add);
  // Caption buttons like the desktop window: minimize collapses to the title bar, maximize toggles
  // full screen, close closes every tab (asking to save) and starts fresh
  const drag = document.createElement('div'); drag.className = 'drag';
  drag.ondblclick = toggleFullscreen; box.append(drag);
  const caps = document.createElement('div'); caps.className = 'caps';
  const full = !!document.fullscreenElement;
  [[ICON.min, '최소화', toggleCollapse, ''], [full ? ICON.restore : ICON.max, full ? '이전 크기로 복원' : '최대화', toggleFullscreen, ''],
   [ICON.close, '닫기', closeAll, 'close']].forEach(([icon, label, fn, cls]) => {
    const b = document.createElement('button'); b.innerHTML = icon; b.title = label; b.setAttribute('aria-label', label);
    if (cls) b.className = cls; b.onclick = e => { e.stopPropagation(); fn(); }; caps.append(b);
  });
  box.append(caps);
  document.title = title(cur()) + ' - Tnote';
}

function toggleCollapse() {
  const app = document.querySelector('.app');
  app.classList.toggle('collapsed');
  if (app.classList.contains('collapsed')) toast('탭 줄을 누르면 다시 펼쳐집니다'); else ed.focus();
}
$('tabs').addEventListener('click', () => { const app = document.querySelector('.app'); if (app.classList.contains('collapsed')) { app.classList.remove('collapsed'); ed.focus(); } });
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { toast('이 화면에서는 전체 화면을 쓸 수 없습니다'); }
}
document.addEventListener('fullscreenchange', () => renderTabs());
async function closeAll() {
  for (const t of [...state.tabs]) {
    if (!state.tabs.includes(t)) continue;
    const before = state.tabs.length;
    await closeTab(t.id);
    if (state.tabs.length === before && state.tabs.includes(t)) return; // cancelled
  }
}
function saveEditorToTab() {
  const t = cur(); if (!t) return;
  t.text = ed.value; t.sel = [ed.selectionStart, ed.selectionEnd]; t.scroll = ed.scrollTop;
}
function loadTabToEditor() {
  blkClear(); const t = cur(); ed.value = t.text;
  const [a, b] = t.sel || [0, 0]; ed.setSelectionRange(a, b); ed.scrollTop = t.scroll || 0;
  renderTabs(); updateStatus(); renderLive();
  if (settings.preview) $('preview').innerHTML = renderMarkdown(ed.value); else ed.focus();
}
function switchTab(id) { saveEditorToTab(); state.active = id; loadTabToEditor(); persistSoon(); }
function newTab(props) {
  saveEditorToTab();
  const t = Object.assign({ id: state.nextId++, name: null, text: '', dirty: false, enc: 'UTF-8', eol: '\r\n' }, props);
  state.tabs.push(t); state.active = t.id; loadTabToEditor(); persistSoon(); return t;
}
async function closeTab(id) {
  saveEditorToTab();
  const t = state.tabs.find(x => x.id === id);
  if (t.dirty) {
    state.active = id; loadTabToEditor();
    const r = await dialog({ title: 'Tnote', body: title(t) + '의 변경 내용을 저장하시겠습니까?',
      buttons: [{ label: '저장', value: 'save', primary: true }, { label: '저장 안 함', value: 'discard' }, { label: '취소', value: null }] });
    if (r === null) return;
    if (r === 'save' && !(await save(false))) return;
  }
  const i = state.tabs.indexOf(t);
  state.tabs.splice(i, 1); delete handles[id];
  if (!state.tabs.length) { state.tabs.push({ id: state.nextId++, name: null, text: '', dirty: false, enc: 'UTF-8', eol: '\r\n' }); }
  if (state.active === id) state.active = state.tabs[Math.min(i, state.tabs.length - 1)].id;
  loadTabToEditor(); persistSoon();
}

// ---------- files ----------
function decode(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return { text: new TextDecoder('utf-8').decode(b.subarray(3)), enc: 'UTF-8(BOM)' };
  if (b[0] === 0xFF && b[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(b.subarray(2)), enc: 'UTF-16 LE' };
  if (b[0] === 0xFE && b[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(b.subarray(2)), enc: 'UTF-16 BE' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(b), enc: 'UTF-8' }; }
  catch { return { text: new TextDecoder('euc-kr').decode(b), enc: 'ANSI' }; }
}
function encode(text, enc) {
  if (enc.startsWith('UTF-16')) {
    const le = enc.endsWith('LE'), out = new Uint8Array(2 + text.length * 2);
    out.set(le ? [0xFF, 0xFE] : [0xFE, 0xFF]);
    for (let i = 0; i < text.length; i++) { const c = text.charCodeAt(i); out[2 + i * 2 + (le ? 0 : 1)] = c & 255; out[2 + i * 2 + (le ? 1 : 0)] = c >> 8; }
    return out;
  }
  const body = new TextEncoder().encode(text); // ANSI is saved as UTF-8: browsers cannot encode legacy code pages
  if (enc !== 'UTF-8(BOM)') return body;
  const out = new Uint8Array(body.length + 3); out.set([0xEF, 0xBB, 0xBF]); out.set(body, 3); return out;
}
async function openBuffer(name, buf, handle) {
  const existing = state.tabs.find(t => t.name === name && !t.dirty && handle && handles[t.id]);

}

}

};
async function save(saveAs) {

  const dl = window.claude ? await window.claude.use('downloads') : null;
  if (dl) {
    let fname = t.name || '제목 없음.txt';
    if (!/\.(txt|md|json|csv|html|svg)$/i.test(fname)) fname += '.txt';
    try {
      await dl.save({ filename: fname, data: new Blob([data]) });
      t.name = fname; t.dirty = false; addRecent(t.name); renderTabs(); persistSoon();
      toast('다운로드했습니다: ' + fname);
      return true;
    } catch (e) {
      if (e && e.code === 'declined') return false;
      if (e && e.code === 'rate_limited') { toast('잠시 후 다시 저장하세요'); return false; }
      // otherwise fall through to the copy fallback below
    }
  }
  try {
    let h = handles[t.id];
    if (dl === null && window.claude) throw new Error('unavailable');
    if ((saveAs || !h) && window.showSaveFilePicker) {
      h = await showSaveFilePicker({ suggestedName: t.name || '제목 없음.txt', types: [{ description: '텍스트 문서', accept: { 'text/plain': ['.txt'] } }] });
    }
    if (h) {
      const w = await h.createWritable(); await w.write(data); await w.close();
      handles[t.id] = h; t.name = h.name;
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'text/plain' }));
      a.download = t.name || '제목 없음.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      t.name = a.download;

    t.dirty = false; addRecent(t.name); renderTabs(); persistSoon(); toast('저장했습니다: ' + t.name);
    return true;
  } catch (e) {
    if (e.name === 'AbortError') return false;
    const r = await dialog({ title: '이 화면에서는 파일로 저장할 수 없습니다',
      body: '브라우저가 이 페이지의 파일 저장을 막았습니다. 내용은 이 브라우저에 자동 보관되어 있습니다. 클립보드로 복사해서 다른 곳에 붙여넣을 수 있습니다.',
      buttons: [{ label: '전체 복사', value: 'copy', primary: true }, { label: '닫기', value: null }] });

}

// Corners are kept in document coordinates (scroll offset included). Char positions come from a hidden
// mirror of the text (one div per logical line), so it works for lines scrolled out of view.
const blk = { on: false, drag: false, a: null, b: null, segs: [], px: 0, py: 0, timer: 0, lines: [] };
const bOv = document.createElement('div'), bMir = document.createElement('div'), bLayer = document.createElement('div');

bMir.style.cssText = 'inset:auto;left:0;top:0;overflow:visible;visibility:hidden';

bOv.append(bMir, bLayer); $('editorWrap').append(bOv);
function blkClear() {
  clearInterval(blk.timer); blk.on = blk.drag = false; blk.segs = []; blk.lines = [];
  bLayer.textContent = ''; bMir.textContent = '';
}
function blkMirror() {

  bMir.className = 'hl' + (shownWrap() ? '' : ' nowrap');
  bMir.style.fontSize = ed.style.fontSize; bMir.style.width = shownWrap() ? ed.clientWidth + 'px' : 'auto';
  bMir.textContent = ''; blk.lines = [];

    const d = document.createElement('div'); d.style.cssText = 'will-change:auto;min-height:1.4em'; d.textContent = l;
    f.append(d); blk.lines.push({ d, o, l }); o += l.length + 1;

}

}
// Segments for the rectangle (document coords): per visual line it touches, the chars between the

function blkSegs(x1, y1, x2, y2) {

  const emit = g => {
    if (!g || g.y + lh <= yt || g.y > yb) return;
    const s = nearest(g.bs, xl), e = nearest(g.bs, xr);
    out.push({ a: g.bs[s].i, b: g.bs[e].i, x: g.bs[s].x, w: g.bs[e].x - g.bs[s].x, y: g.y, h: lh });

function applySettings() {
  ed.classList.toggle('nowrap', !shownWrap());
  ed.style.fontSize = $('hl').style.fontSize = (15 * settings.zoom) + 'px';
  $('hl').classList.toggle('nowrap', !shownWrap());
  renderLive();
  $('status').hidden = !settings.statusBar;
  if (settings.theme === 'system') document.documentElement.removeAttribute('data-theme');

const setZoom = z => { settings.zoom = Math.round(Math.min(5, Math.max(0.1, z)) * 10) / 10; applySettings(); };

// ---------- find / replace / goto ----------
let lastFind = '';
function showFind(replace) {
  $('findbar').hidden = false;
  $('replaceInput').hidden = $('replaceOne').hidden = $('replaceAll').hidden = !replace;
  const sel = ed.value.slice(ed.selectionStart, ed.selectionEnd);
  if (sel && !sel.includes('\n')) $('findInput').value = sel;
  $('findMsg').textContent = '';
  $('findInput').focus(); $('findInput').select();
}
function findNext(forward) {
  const q = $('findInput').value || lastFind; lastFind = q;
  if (!q) { showFind(false); return false; }
  const mc = $('matchCase').checked, hay = mc ? ed.value : ed.value.toLowerCase(), n = mc ? q : q.toLowerCase();
  let i;
  if (forward) { i = hay.indexOf(n, ed.selectionEnd); if (i < 0) i = hay.indexOf(n); }
  else { i = ed.selectionStart > 0 ? hay.lastIndexOf(n, ed.selectionStart - 1) : -1; if (i < 0) i = hay.lastIndexOf(n); }
  if (i < 0) { $('findMsg').textContent = `"${q}"을(를) 찾을 수 없습니다.`; return false; }
  $('findMsg').textContent = '';
  ed.focus(); ed.setSelectionRange(i, i + q.length);
  const lines = ed.value.slice(0, i).split('\n').length;
  ed.scrollTop = Math.max(0, (lines - 5) * parseFloat(getComputedStyle(ed).lineHeight));
  updateStatus(); return true;
}
function setText(v, selStart, selEnd) {
  // execCommand keeps the native undo stack where supported
  blkClear(); ed.focus(); ed.select();
  if (!document.execCommand('insertText', false, v)) { ed.value = v; ed.dispatchEvent(new Event('input')); }
  ed.setSelectionRange(selStart, selEnd);
}
$('findNext').onclick = () => findNext(true);
$('findPrev').onclick = () => findNext(false);
$('replaceOne').onclick = () => {
  const q = $('findInput').value, sel = ed.value.slice(ed.selectionStart, ed.selectionEnd);
  const mc = $('matchCase').checked;
  if (q && (mc ? sel === q : sel.toLowerCase() === q.toLowerCase())) {
    ed.focus();
    if (!document.execCommand('insertText', false, $('replaceInput').value)) {
      ed.setRangeText($('replaceInput').value, ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input'));
    }
  }
  findNext(true);
};
$('replaceAll').onclick = () => {
  const q = $('findInput').value; if (!q) return;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(esc, $('matchCase').checked ? 'g' : 'gi');
  const count = (ed.value.match(re) || []).length;
  if (!count) { $('findMsg').textContent = `"${q}"을(를) 찾을 수 없습니다.`; return; }
  const r = $('replaceInput').value;
  setText(ed.value.replace(re, () => r), 0, 0);
  toast(`${count}개를 바꿨습니다`);
};
$('findClose').onclick = () => { $('findbar').hidden = true; ed.focus(); };
$('findInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); findNext(!e.shiftKey); $('findInput').focus(); }
  if (e.key === 'Escape') $('findClose').click();
});
$('replaceInput').addEventListener('keydown', e => { if (e.key === 'Escape') $('findClose').click(); });

async function gotoLine() {
  const total = ed.value.split('\n').length, curLine = ed.value.slice(0, ed.selectionStart).split('\n').length;
  const r = await dialog({ title: '줄 이동', input: { type: 'number', min: 1, max: total, value: curLine, ariaLabel: '줄 번호' },
    buttons: [{ label: '이동', value: 'go', primary: true }, { label: '취소', value: null }] });
  if (!r) return;
  const n = parseInt(r.value, 10);
  if (!(n >= 1 && n <= total)) { toast(`1에서 ${total} 사이의 줄 번호를 입력하세요`); return; }
  const pos = ed.value.split('\n').slice(0, n - 1).reduce((a, l) => a + l.length + 1, 0);
  ed.setSelectionRange(pos, pos);
  ed.scrollTop = Math.max(0, (n - 5) * parseFloat(getComputedStyle(ed).lineHeight));
  updateStatus();
}
function insertDate() {
  const d = new Date(), h = d.getHours();
  const s = `${h < 12 ? '오전' : '오후'} ${(h % 12) || 12}:${String(d.getMinutes()).padStart(2, '0')} ` +
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  ed.focus();
  if (!document.execCommand('insertText', false, s)) { ed.setRangeText(s, ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
}

  showPreviewState(); persistSoon();
}
function showPreviewState() {
  const on = !!settings.preview;
  if (on) $('preview').innerHTML = renderMarkdown(ed.value);
  $('preview').hidden = !on; $('editorWrap').hidden = on;
  const b = $('pvBtn'); if (b) b.setAttribute('aria-pressed', String(on));
  if (!on) ed.focus();
}
async function openSettings() {
  const r = await dialog({ title: '설정', body: `테마: ${{ system: '시스템 설정', light: '밝게', dark: '어둡게' }[settings.theme]} · 자동 줄 바꿈: ${settings.wrap ? '켬' : '끔'} · 상태 표시줄: ${settings.statusBar ? '켬' : '끔'}`,
    buttons: [{ label: '테마 바꾸기', value: 'theme' }, { label: '줄 바꿈 전환', value: 'wrap' }, { label: '상태 표시줄 전환', value: 'status' }, { label: '닫기', value: null, primary: true }] });
  if (r === 'theme') settings.theme = { system: 'light', light: 'dark', dark: 'system' }[settings.theme];
  if (r === 'wrap') settings.wrap = !settings.wrap;
  if (r === 'status') settings.statusBar = !settings.statusBar;
  if (r) { applySettings(); openSettings(); }
}
function showMenu(wrap, btn, idx) {
  const items = MENUS()[idx][1];
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') { m.append(document.createElement('hr')); return; }
    const [label, key, fn, extra] = it;
    if (extra === 'recent') {
      const head = document.createElement('div'); head.className = 'empty'; head.textContent = '최근 파일';
      m.append(head);
      if (!recent.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = ' 없음'; m.append(e); }
      recent.forEach(n => {
        const b = document.createElement('button'); b.setAttribute('role', 'menuitem');
        const s = document.createElement('span'); s.textContent = ' ' + n; b.append(s);
        b.onclick = () => { closeMenus(); const t = state.tabs.find(t => t.name === n); if (t) switchTab(t.id); else { toast('이 파일은 다시 열어야 합니다'); openFile(); } };
        m.append(b);
      });
      return;
    }
    const b = document.createElement('button'); b.setAttribute('role', 'menuitem');
    const s = document.createElement('span'); s.textContent = label;
    if (typeof extra === 'boolean') s.className = extra ? 'check' : 'nocheck';
    const k = document.createElement('kbd'); k.textContent = key;
    b.append(s, k); b.onclick = () => { closeMenus(); fn(); };
    m.append(b);
  });
  wrap.append(m); openMenu = m; btn.setAttribute('aria-expanded', 'true');
  m.querySelector('button')?.focus();
}
document.addEventListener('click', e => { if (openMenu && !openMenu.contains(e.target)) closeMenus(); });

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if ($('modalRoot').firstChild) return;
  const k = e.key.toLowerCase(), c = e.ctrlKey || e.metaKey;
  const act = (fn) => { e.preventDefault(); closeMenus(); fn(); };
  if (blk.on && !['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) {
    if (c && (k === 'c' || k === 'x')) {
      e.preventDefault(); navigator.clipboard.writeText(blkText()).catch(() => {}); if (k === 'x') blkDelete(); return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); blkDelete(); return; }
    blkClear();
  }
  if (e.key === 'Escape' && openMenu) return act(() => {});
  if (c && !e.shiftKey && k === 's') return act(() => save(false));
  if (c && e.shiftKey && k === 's') return act(() => save(true));
  if (c && k === 'o') return act(openFile);
  if (c && !e.shiftKey && k === 'b') return act(() => wrapSel('**'));
  if (c && !e.shiftKey && k === 'i') return act(() => wrapSel('*'));
  if (c && !e.shiftKey && k === 'k') return act(insertLink);
  if (c && e.shiftKey && k === 'm') return act(togglePreview);
  if (c && k === 'f') return act(() => showFind(false));
  if (c && k === 'h') return act(() => showFind(true));
  if (c && k === 'g') return act(gotoLine);
  if (c && (k === '=' || k === '+')) return act(() => setZoom(settings.zoom + 0.1));
  if (c && k === '-') return act(() => setZoom(settings.zoom - 0.1));
  if (c && k === '0') return act(() => setZoom(1));
  if (e.altKey && k === 'n') return act(() => newTab());
  if (e.altKey && k === 'w') return act(() => closeTab(state.active));
  if (e.key === 'F3') return act(() => findNext(!e.shiftKey));
  if (e.key === 'F5') return act(insertDate);
  if (e.key === 'Tab' && document.activeElement === ed) {
    e.preventDefault();
    if (!document.execCommand('insertText', false, '\t')) { ed.setRangeText('\t', ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
  }
});
window.addEventListener('beforeunload', () => { saveEditorToTab(); persist(); });

// Drag and drop files anywhere on the window (otherwise the browser navigates to the dropped file)
window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
window.addEventListener('drop', async e => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  for (const f of e.dataTransfer.files) await openBuffer(f.name, await f.arrayBuffer(), null);
});

renderMenubar();
applySettings();
loadTabToEditor();
showPreviewState();
</script>
